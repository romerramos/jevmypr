<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>You're offline – Jev my PR</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #FBFCFD; --ink: #18222E; --muted: #4A5B6D; --line: #D3DBE3; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --bg: #121922; --ink: #E8EDF2; --muted: #9AABBD; --line: #2C3947; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px;
           background: var(--bg); color: var(--ink); font: 17px/1.55 "Atkinson Hyperlegible Next", ui-sans-serif, system-ui, sans-serif; }
    main { max-width: 30rem; }
    img { width: 56px; height: 56px; transform: rotate(-4deg); }
    h1 { margin: 20px 0 8px; font: 800 clamp(2rem, 7vw, 2.75rem)/1.05 "Archivo", ui-sans-serif, system-ui, sans-serif; letter-spacing: -0.01em; }
    p { margin: 0; color: var(--muted); }
    button { margin-top: 28px; padding: 12px 20px; border: 0; border-radius: 6px; background: var(--ink); color: var(--bg);
             font: inherit; font-weight: 700; cursor: pointer; }
    button:focus-visible { outline: 2px solid #2B6CB0; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <img src="/icon.svg" alt="">
    <h1>You're offline.</h1>
    <p>Jev my PR reads pull requests from GitHub and asks Jev about them, so it needs a connection. Reconnect and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
