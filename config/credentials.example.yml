# The secrets Jev my PR needs. Put them in your own encrypted credentials:
#
#   bin/rails credentials:edit
#
# or set the environment variables named on the right instead (useful for Docker, Kamal, CI).
# This file is only a template; never put real values in it.

github:                        # A GitHub OAuth App (github.com/settings/developers)
  client_id: Ov23xxxxxxxxxxxx          # GITHUB_CLIENT_ID
  client_secret: xxxxxxxxxxxxxxxx      # GITHUB_CLIENT_SECRET

typesafe:                      # https://typesafe.ai
  api_key: xxxxxxxxxxxxxxxx            # TYPESAFE_API_KEY

# Encrypts users' GitHub tokens at rest. Generate with: bin/rails db:encryption:init
active_record_encryption:
  primary_key: xxxxxxxxxxxxxxxx        # ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
  deterministic_key: xxxxxxxxxxxxxxxx  # ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
  key_derivation_salt: xxxxxxxxxxxxxxx # ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT

# secret_key_base is generated for you by credentials:edit (or set SECRET_KEY_BASE in production).
